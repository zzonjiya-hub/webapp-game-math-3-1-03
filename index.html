<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가자! 내 땅으로! - 나눗셈 놀이</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body { 
            font-family: 'Jua', sans-serif; 
            overflow: hidden;
            background-color: #f8fafc;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container-main {
            width: 100vw;
            height: 100vh;
            padding: 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            gap: 15px;
        }

        .board-grid {
            display: grid;
            grid-template-columns: 100px repeat(19, 1fr) 100px;
            gap: 4px;
            background-color: #334155;
            border: 8px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-width: 1700px;
        }

        .cell {
            background-color: white;
            height: 95px; /* 8줄일 때(70px)보다 높이를 키워 전체 크기 유지 */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .cell-green { background-color: #f0fdf4; }
        .cell-yellow { background-color: #fefce8; }
        .cell-start { background-color: #fdf2f8; }
        .cell-goal-green { background-color: #22c55e; color: white; }
        .cell-goal-yellow { background-color: #eab308; color: white; }
        
        .stone {
            width: 60px; 
            height: 60px;
            border-radius: 50%;
            background-color: #1e293b;
            box-shadow: 2px 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            border: 3px solid #64748b;
            position: relative;
        }

        /* 선택된 바둑돌 애니메이션 및 효과 */
        .stone.selected {
            transform: scale(1.3) translateY(-15px);
            box-shadow: 0 15px 25px rgba(0,0,0,0.4);
            z-index: 20;
            animation: bounce 0.8s infinite alternate;
        }

        .stone.selected-p1 { border: 6px solid #22c55e; }
        .stone.selected-p2 { border: 6px solid #eab308; }

        @keyframes bounce {
            from { transform: scale(1.3) translateY(-15px); }
            to { transform: scale(1.3) translateY(-22px); }
        }

        .player-active-green {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.4);
        }
        
        .player-active-yellow {
            background-color: #fef9c3 !important;
            border-color: #eab308 !important;
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.4);
        }

        .num-btn {
            transition: all 0.1s;
            user-select: none;
        }

        .num-btn:active {
            transform: scale(0.9);
            background-color: #dbeafe;
        }

        /* 팝업 모달 스타일 */
        #problem-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none; 
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 50px;
            border: 12px solid #f9a8d4; 
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 1000px;
            width: 95%;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* 공통 버튼 스타일 */
        .btn-green { background-color: #22c55e; }
        .btn-green:hover { background-color: #16a34a; }
        .btn-yellow { background-color: #eab308; }
        .btn-yellow:hover { background-color: #ca8a04; }
        .btn-blue { background-color: #2563eb; }
        .btn-blue:hover { background-color: #1d4ed8; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .deciding { animation: blink 0.1s infinite; }
    </style>
</head>
<body>

    <!-- 문제 출제 팝업 모달 -->
    <div id="problem-modal">
        <div class="modal-content">
            <h2 id="modal-team-name" class="text-3xl mb-4 font-bold text-gray-600">초록팀의 문제</h2>
            <div id="modal-question" class="text-8xl font-black text-gray-800 mb-8 py-10 bg-gray-50 rounded-3xl shadow-inner">
                12 ÷ 3 = ?
            </div>
            <div id="modal-answers" class="flex flex-row justify-center gap-2 overflow-x-auto py-4">
                <script>
                    for(let i=1; i<=9; i++) {
                        document.write(`<button onclick="checkAnswer(${i})" class="num-btn bg-white hover:border-blue-500 border-4 border-gray-200 rounded-2xl w-16 h-20 sm:w-20 sm:h-24 text-4xl font-black text-gray-700 shadow-lg flex-shrink-0">${i}</button>`);
                    }
                </script>
            </div>
            <div id="modal-feedback" class="mt-6 text-3xl font-bold h-10"></div>
        </div>
    </div>

    <div class="container-main">
        <header class="text-center">
            <h1 class="text-6xl text-blue-900">가자! 내 땅으로!</h1>
        </header>

        <!-- 상단 정보 영역 -->
        <div class="w-full max-w-[1700px] flex flex-row items-stretch gap-8 h-64">
            <div id="player1-ui" class="w-1/4 bg-white p-4 rounded-3xl border-8 border-green-500 text-center transition-all flex flex-col justify-center shadow-md">
                <div class="text-3xl font-bold text-green-700">초록팀</div>
                <div class="text-7xl mt-2 font-black text-green-600"><span id="p1-score">0</span>점</div>
            </div>

            <div class="flex-1 bg-white p-4 rounded-3xl shadow-2xl border-8 border-blue-100 flex flex-col items-center justify-center relative overflow-hidden">
                <div id="game-message" class="text-2xl text-center mb-4 text-blue-900 font-bold h-10">게임을 시작하려면 버튼을 누르세요!</div>
                
                <div id="card-display" class="hidden w-full max-w-lg h-32 bg-white border-8 border-pink-300 rounded-[35px] shadow-inner flex items-center justify-center text-4xl font-black text-gray-800 cursor-pointer hover:border-pink-400 transition-all hover:scale-105 active:scale-95 text-center">
                    문제를 뽑아주세요!
                </div>

                <button id="main-btn" class="btn-blue text-white px-16 py-4 rounded-full text-4xl transition-all shadow-xl font-bold transform hover:scale-105">
                    게임 시작
                </button>
            </div>

            <div id="player2-ui" class="w-1/4 bg-white p-4 rounded-3xl border-8 border-yellow-500 text-center transition-all opacity-50 flex flex-col justify-center shadow-md">
                <div class="text-3xl font-bold text-yellow-700">노랑팀</div>
                <div class="text-7xl mt-2 font-black text-yellow-500"><span id="p2-score">0</span>점</div>
            </div>
        </div>

        <!-- 하단 보드판 영역 -->
        <div class="w-full flex-1 flex items-center justify-center mb-4">
            <div id="game-board" class="board-grid">
                <!-- JS로 동적 생성 -->
            </div>
        </div>
    </div>

    <script>
        // --- 사운드 시스템 ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(freq, type, duration, gainValue = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(gainValue, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const sfx = {
            click: () => playSfx(600, 'sine', 0.1),
            tick: () => playSfx(400, 'square', 0.05, 0.05),
            match: () => {
                playSfx(523, 'triangle', 0.2);
                setTimeout(() => playSfx(659, 'triangle', 0.2), 100);
                setTimeout(() => playSfx(783, 'triangle', 0.3), 200);
            },
            correct: () => {
                playSfx(880, 'sine', 0.2);
                setTimeout(() => playSfx(1108, 'sine', 0.3), 100);
            },
            wrong: () => {
                playSfx(220, 'sawtooth', 0.3, 0.2);
                setTimeout(() => playSfx(180, 'sawtooth', 0.3, 0.2), 150);
            },
            move: () => playSfx(440, 'triangle', 0.2),
            stoneSelect: () => {
                playSfx(800, 'sine', 0.1, 0.15);
                setTimeout(() => playSfx(1000, 'sine', 0.1, 0.1), 50);
            },
            win: () => {
                const notes = [523, 659, 783, 1046, 1318];
                notes.forEach((f, i) => setTimeout(() => playSfx(f, 'triangle', 0.5), i * 150));
            }
        };

        const ROWS = 6; 
        const START_COL = 10; 
        const BOARD_WIDTH = 21; 
        const STONE_COUNT = 6; 
        
        let gameState = 'START'; 
        let currentPlayer = 1; 
        let currentProblem = { q: '', a: 0 };
        let selectedStoneIndex = -1;
        let scores = [0, 0];
        
        let stones = [];
        for(let i = 0; i < STONE_COUNT; i++) {
            stones.push({ row: i, pos: START_COL });
        }

        const boardEl = document.getElementById('game-board');
        const mainBtn = document.getElementById('main-btn');
        const cardDisplay = document.getElementById('card-display');
        const messageEl = document.getElementById('game-message');
        const modal = document.getElementById('problem-modal');
        const modalQuestion = document.getElementById('modal-question');
        const modalFeedback = document.getElementById('modal-feedback');
        const modalTeamName = document.getElementById('modal-team-name');
        const p1ScoreEl = document.getElementById('p1-score');
        const p2ScoreEl = document.getElementById('p2-score');

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            }
        }

        function initBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                const p1Goal = document.createElement('div');
                p1Goal.className = 'cell cell-goal-green font-black text-4xl border-r-2 border-green-600';
                if (r === 2) p1Goal.innerText = '도';
                if (r === 3) p1Goal.innerText = '착';
                boardEl.appendChild(p1Goal);

                for (let c = 1; c < BOARD_WIDTH - 1; c++) {
                    const cell = document.createElement('div');
                    let typeClass = (c === START_COL) ? 'cell-start' : (c < START_COL ? 'cell-green' : 'cell-yellow');
                    cell.className = `cell ${typeClass} border-[1px] border-gray-200`;
                    cell.id = `cell-${r}-${c}`;
                    boardEl.appendChild(cell);
                }

                const p2Goal = document.createElement('div');
                p2Goal.className = 'cell cell-goal-yellow font-black text-4xl border-l-2 border-yellow-600';
                if (r === 2) p2Goal.innerText = '도';
                if (r === 3) p2Goal.innerText = '착';
                boardEl.appendChild(p2Goal);
            }
            renderStones();
        }

        function renderStones() {
            document.querySelectorAll('.stone').forEach(s => s.remove());
            stones.forEach((stone, idx) => {
                if (stone.pos < 0 || stone.pos >= BOARD_WIDTH) return;
                const cell = document.getElementById(`cell-${stone.row}-${stone.pos}`);
                if (cell) {
                    const stoneEl = document.createElement('div');
                    let selectedClass = '';
                    if (selectedStoneIndex === idx) {
                        selectedClass = `selected ${currentPlayer === 1 ? 'selected-p1' : 'selected-p2'}`;
                    }
                    stoneEl.className = `stone ${selectedClass}`;
                    stoneEl.onclick = (e) => {
                        e.stopPropagation();
                        if (gameState === 'SELECT_STONE') {
                            sfx.stoneSelect();
                            selectStone(idx);
                        }
                    };
                    cell.appendChild(stoneEl);
                }
            });
        }

        function selectStone(idx) {
            selectedStoneIndex = idx;
            renderStones();
            messageEl.innerText = `바둑돌 선택 완료! 이동하시겠습니까?`;
            mainBtn.classList.remove('hidden');
            mainBtn.innerText = '이동하기';
            mainBtn.className = `px-16 py-4 rounded-full text-4xl transition-all shadow-xl font-bold transform hover:scale-105 ${currentPlayer === 1 ? 'btn-green' : 'btn-yellow'} text-white`;
        }

        function generateProblem() {
            const divisor = Math.floor(Math.random() * 8) + 2; 
            const answer = Math.floor(Math.random() * 9) + 1;  
            const dividend = divisor * answer;
            return { q: `${dividend} ÷ ${divisor} = ?`, a: answer };
        }

        async function decideFirstPlayer() {
            gameState = 'DECIDING';
            mainBtn.classList.add('hidden');
            let count = 0;
            const teams = ['초록팀', '노랑팀'];
            const interval = setInterval(() => {
                const team = teams[count % 2];
                messageEl.innerText = team;
                messageEl.className = `text-5xl font-black ${team === '초록팀' ? 'text-green-600' : 'text-yellow-500'} deciding`;
                sfx.tick();
                count++;
                if (count > 20) {
                    clearInterval(interval);
                    sfx.match();
                    currentPlayer = Math.random() > 0.5 ? 1 : 2;
                    messageEl.className = "text-5xl font-black text-red-600";
                    messageEl.innerText = `[${currentPlayer === 1 ? '초록팀' : '노랑팀'}] 선공!`;
                    setTimeout(setupTurn, 1500);
                }
            }, 80);
        }

        function setupTurn() {
            gameState = 'PICK_CARD';
            selectedStoneIndex = -1;
            document.getElementById('player1-ui').style.opacity = currentPlayer === 1 ? '1' : '0.5';
            document.getElementById('player2-ui').style.opacity = currentPlayer === 2 ? '1' : '0.5';
            document.getElementById('player1-ui').classList.toggle('player-active-green', currentPlayer === 1);
            document.getElementById('player2-ui').classList.toggle('player-active-yellow', currentPlayer === 2);
            
            messageEl.className = "text-2xl text-center mb-4 text-blue-900 font-bold h-10";
            messageEl.innerText = `${currentPlayer === 1 ? '초록팀' : '노랑팀'} 차례! 문제를 뽑으세요.`;
            cardDisplay.innerText = '문제를 뽑아주세요!';
            cardDisplay.classList.remove('hidden');
            mainBtn.classList.add('hidden');
            renderStones();
        }

        function checkAnswer(val) {
            if (val === currentProblem.a) {
                sfx.correct();
                modalFeedback.innerText = "정답입니다! 🎉";
                modalFeedback.className = "mt-6 text-3xl font-bold text-green-600 h-10";
                setTimeout(() => {
                    modal.style.display = 'none';
                    gameState = 'SELECT_STONE';
                    messageEl.innerText = `정답! 바둑돌을 선택해 주세요. (몫: ${currentProblem.a})`;
                    cardDisplay.classList.add('hidden');
                }, 1000);
            } else {
                sfx.wrong();
                modalFeedback.innerText = "틀렸습니다! 다음 팀에게 기회가 넘어갑니다.";
                modalFeedback.className = "mt-6 text-3xl font-bold text-red-500 h-10";
                setTimeout(() => {
                    modal.style.display = 'none';
                    currentPlayer = currentPlayer === 1 ? 2 : 1;
                    setupTurn();
                }, 1500);
            }
        }

        async function animateMovement(idx, startPos, endPos) {
            const stone = stones[idx];
            const direction = endPos > startPos ? 1 : -1;
            const steps = Math.abs(endPos - startPos);
            
            for (let i = 1; i <= steps; i++) {
                await new Promise(resolve => setTimeout(resolve, 200));
                stone.pos += direction;
                sfx.move();
                renderStones();
            }
            
            // 득점 처리
            if (currentPlayer === 1 && stone.pos <= 0) {
                stone.pos = -1;
                scores[0]++;
                p1ScoreEl.innerText = scores[0];
            } else if (currentPlayer === 2 && stone.pos >= BOARD_WIDTH - 1) {
                stone.pos = BOARD_WIDTH;
                scores[1]++;
                p2ScoreEl.innerText = scores[1];
            }

            // 게임 종료 체크
            if (scores[0] + scores[1] === STONE_COUNT) {
                gameState = 'GAME_OVER';
                sfx.win();
                
                let winMsg = "";
                if (scores[0] > scores[1]) {
                    winMsg = "초록팀 승리!";
                } else if (scores[1] > scores[0]) {
                    winMsg = "노랑팀 승리!";
                } else {
                    winMsg = "무승부!"; // 무승부일 때 '승리' 단어 제거
                }

                messageEl.innerHTML = `<span class="text-6xl text-blue-600 font-black">${winMsg}</span>`;
                mainBtn.className = "btn-blue text-white px-16 py-4 rounded-full text-4xl shadow-xl font-bold";
                mainBtn.innerText = '다시 하기';
                mainBtn.classList.remove('hidden');
            } else {
                currentPlayer = currentPlayer === 1 ? 2 : 1;
                setupTurn();
            }
        }

        mainBtn.onclick = () => {
            sfx.click();
            if (gameState === 'START') {
                toggleFullScreen();
                decideFirstPlayer();
            } else if (gameState === 'SELECT_STONE') {
                const move = currentProblem.a;
                const startPos = stones[selectedStoneIndex].pos;
                let endPos = currentPlayer === 1 ? startPos - move : startPos + move;
                
                if (currentPlayer === 1 && endPos < 0) endPos = 0;
                if (currentPlayer === 2 && endPos > BOARD_WIDTH - 1) endPos = BOARD_WIDTH - 1;

                gameState = 'MOVING';
                mainBtn.classList.add('hidden');
                animateMovement(selectedStoneIndex, startPos, endPos);
            } else if (gameState === 'GAME_OVER') {
                location.reload();
            }
        };

        cardDisplay.onclick = () => {
            if (gameState === 'PICK_CARD') {
                sfx.click();
                currentProblem = generateProblem();
                modalTeamName.innerText = `${currentPlayer === 1 ? '초록팀' : '노랑팀'}의 문제`;
                modalTeamName.className = `text-3xl mb-4 font-bold ${currentPlayer === 1 ? 'text-green-600' : 'text-yellow-600'}`;
                modalQuestion.innerText = currentProblem.q;
                modalFeedback.innerText = "";
                modal.style.display = 'flex';
            }
        };

        window.onload = initBoard;
    </script>
</body>
</html>
